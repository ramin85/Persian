name: Build and deploy Namakade addon

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore scrape cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: details-${{ github.run_id }}
          restore-keys: details-
      - name: Scrape and generate addon
        run: node build.mjs
        env:
          BUDGET_MIN: "40"
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          # ALSO_SERVE_IMDB_IDS: "1"   # optional, see README
      - name: Save scrape cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: details-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
